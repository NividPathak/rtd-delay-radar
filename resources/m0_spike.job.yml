# M0 job: proves the bundle deploys, and runs Spike 2 (outbound access from serverless).
# No schedule. Run it by hand with: databricks bundle run m0_spike_job
resources:
  jobs:
    m0_spike_job:
      name: m0_spike_job
      tasks:
        - task_key: outbound_access_spike
          notebook_task:
            notebook_path: ../notebooks/spike_outbound_access.py
