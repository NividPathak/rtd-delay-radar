  prod:
    mode: production
    workspace:
      host: https://dbc-5b0fa231-e20d.cloud.databricks.com
      root_path: /Workspace/Users/nivid.pathak16@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
