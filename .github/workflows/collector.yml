# Backup collector. Every 15 minutes it checks the volume. If no snapshot arrived in the
# last 5 minutes (the laptop collector is off or asleep), it collects for 55 minutes.
# Needs repo secrets DATABRICKS_HOST and DATABRICKS_TOKEN. Skips cleanly without them.
name: collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect even if the volume is fresh"
        type: boolean
        default: false

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "Databricks secrets not set, skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: uv sync --python 3.11 --no-dev
      - name: Check volume freshness
        id: fresh
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [ "${{ inputs.force }}" != "true" ] && uv run python -m src.collector.freshness --max-age 300; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect for 55 minutes
        if: steps.fresh.outputs.stale == 'true'
        run: uv run python -m src.collector.run --minutes 55
