# Deploy the prod bundle target on every push to main, after lint and tests pass.
# Needs repo secrets DATABRICKS_HOST and DATABRICKS_TOKEN. Skips cleanly without them.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.11
      - run: uv run ruff check
      - run: uv run pytest -q
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "Databricks secrets not set, skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: databricks/setup-cli@main
        if: steps.secrets.outputs.ok == 'true'
      - name: Validate bundle
        if: steps.secrets.outputs.ok == 'true'
        run: databricks bundle validate -t prod
      - name: Deploy bundle
        if: steps.secrets.outputs.ok == 'true'
        run: databricks bundle deploy -t prod
