[project]
name = "rtd-delay-radar"
version = "0.1.0"
description = "Real-time transit delay prediction for Denver RTD on Databricks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gtfs-realtime-bindings>=1.0.0",
    "databricks-sdk>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Local Spark for unit tests only. Serverless compute provides its own Spark.
    "pyspark>=4.0,<4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
